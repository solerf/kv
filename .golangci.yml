version: "2"

linters:
  # Keep the default set (errcheck, govet, ineffassign, staticcheck, unused)
  # and add unparam, which flags always-nil error returns and unused params.
  enable:
    - unparam
  settings:
    errcheck:
      # These functions return errors we deliberately ignore.
      exclude-functions:
        # Writes to an HTTP response body. The only failure mode is a client
        # that has disconnected, and we cannot report an error over a broken
        # connection, so there is nothing actionable to do with it.
        - (net/http.ResponseWriter).Write
        - (github.com/a-h/templ.Component).Render
        - (*encoding/json.Encoder).Encode
        # Deferred Close on handles we only read from: nothing was buffered to
        # flush, so a Close error carries no information we can act on.
        - (*os.File).Close
        - (io.ReadCloser).Close
